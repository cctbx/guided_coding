# Checks of the GuidedCoding skill and its review tool (tst_guided_coding.py),
# on Linux and macOS.

name: tests
on: [push, pull_request, workflow_dispatch]

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The page's Markdown safety tests need Python-Markdown; here only, in
      #  CI, the version they were checked with is installed, and the tests
      #  then refuse to skip them (GC_REQUIRE_MARKDOWN)
      - name: Python-Markdown for the page tests
        run: |
          python -m pip install "markdown==3.10.3"
          python -c "import markdown; print('markdown', markdown.__version__)"
      - name: Skill checks
        env:
          GC_REQUIRE_MARKDOWN: "1"
        run: python tst_guided_coding.py
